<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5C6BC0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3f4771;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#grad1)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Geek glasses -->
  <g fill="#ffffff">
    <!-- Left lens -->
    <circle cx="22" cy="26" r="8" fill="none" stroke="#ffffff" stroke-width="2"/>
    <!-- Right lens -->
    <circle cx="42" cy="26" r="8" fill="none" stroke="#ffffff" stroke-width="2"/>
    <!-- Bridge -->
    <line x1="30" y1="26" x2="34" y2="26" stroke="#ffffff" stroke-width="2"/>
    <!-- Left temple -->
    <line x1="14" y1="26" x2="10" y2="24" stroke="#ffffff" stroke-width="2"/>
    <!-- Right temple -->
    <line x1="50" y1="26" x2="54" y2="24" stroke="#ffffff" stroke-width="2"/>
  </g>
  
  <!-- Heaven halo -->
  <ellipse cx="32" cy="16" rx="12" ry="3" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.8"/>
  
  <!-- Smile -->
  <path d="M 24 38 Q 32 46 40 38" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Eyes -->
  <circle cx="22" cy="26" r="2" fill="#ffffff"/>
  <circle cx="42" cy="26" r="2" fill="#ffffff"/>
</svg>